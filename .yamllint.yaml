extends: default

rules:
  document-start: disable
  line-length:
    max: 120
    allow-non-breakable-inline-mappings: true
    allow-non-breakable-words: true
  # GitHub Actions uses the key `on`, which yamllint otherwise treats as a boolean.
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
