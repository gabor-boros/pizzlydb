[package]
name = "pizzlydb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.88"
description = "Coverage-guided decoder fuzz targets. Separate workspace so libFuzzer can unwind."

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
libfuzzer-sys = "0.4"
pizzlydb-core = { path = "../crates/pizzlydb-core" }
pizzlydb-graph = { path = "../crates/pizzlydb-graph", features = ["fuzzing"] }
pizzlydb-storage = { path = "../crates/pizzlydb-storage", features = ["fuzzing"] }

[profile.release]
debug = 1

[[bin]]
name = "page_header"
path = "fuzz_targets/page_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "superblock"
path = "fuzz_targets/superblock.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wal_header"
path = "fuzz_targets/wal_header.rs"
test = false
doc = false
bench = false

